<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tayfun V3 - Grand Strategy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        
        <!-- SOL PANEL: Sizin Ülkeniz ve Ekonominiz -->
        <div class="panel" id="left-panel">
            <h2>TÜRKİYE (OYUNCU)</h2>
            <div class="stat-box">💰 Hazine: <span id="val-budget"></span></div>
            <div class="stat-box">👥 İnsan Gücü: <span id="val-manpower"></span></div>
            <div class="stat-box">⚖️ İstikrar: <span id="val-stability"></span></div>
            <div class="stat-box">☢️ Uranyum: <span id="val-uranium"></span></div>
            <div class="stat-box">⏳ Tur: <span id="val-turn"></span></div>
            <div class="stat-box tension-box">🌍 Global Tansiyon: <span id="val-tension"></span></div>

            <h3>AR-GE MERKEZİ</h3>
            <button class="btn-tech" onclick="engine.research('nuclear')">☢️ Nükleer Silahlanma (100.000$)</button>
            <button class="btn-tech" onclick="engine.research('cyber')">💻 Siber İstihbarat Ağı (40.000$)</button>
            
            <h3>MÜHİMMAT ENVANTERİ</h3>
            <div id="inventory-list">
                <!-- Javascript burayı otomatik dolduracak -->
            </div>

            <button onclick="engine.nextTurn()" class="btn-turn">⏳ TUR ATLA (Maaş & Üretim)</button>
        </div>

        <!-- ORTA PANEL: HARİTA VE ANİMASYONLAR -->
        <div id="map-wrapper">
            <!-- Ülkelerin ve Şehirlerin çizildiği alt katman -->
            <svg id="game-map"></svg>
            <!-- Füzelerin, dronların ve patlamaların yaşandığı üst katman -->
            <canvas id="animCanvas"></canvas>
        </div>

        <!-- SAĞ PANEL: Diplomasi ve Savaş -->
        <div class="panel" id="right-panel">
            <h2>HEDEF: <span id="target-country-name">Seçilmedi</span></h2>
            <div class="stat-box">🤝 İlişki Seviyesi: %<span id="target-relation"></span></div>
            <div class="stat-box">⚖️ Hedef İstikrar: <span id="target-stability"></span></div>
            
            <h3>DİPLOMASİ</h3>
            <button class="btn-dip" onclick="engine.diplomacy('justify')">🕵️ Casus Belli Yarat (25.000$)</button>
            <button class="btn-war" onclick="engine.diplomacy('war')">⚔️ SAVAŞ İLAN ET</button>

            <h3>HAREKAT & TAARRUZ</h3>
            <label>Vurulacak Şehir:</label>
            <select id="target-city-select" onchange="ui.onCityChange()">
                <!-- JS dolduracak -->
            </select>
            <div id="target-city-info" class="hss-info">HSS Durumu: Bilinmiyor (Siber Ağ Gerekli)</div>
            
            <label>Kullanılacak Mühimmat:</label>
            <select id="attack-weapon">
                <option value="drone_swarm">Sürü Drone (HSS Tüketmek için ideal - Hasar: 2)</option>
                <option value="ballistic">Balistik Füze (Ana Taarruz - Hasar: 20)</option>
                <option value="nuke">Nükleer Başlık (Şehri Yok Eder - Hasar: 100)</option>
            </select>
            
            <label>Ateşlenecek Miktar:</label>
            <input type="number" id="attack-amount" value="5" min="1" max="1000">
            
            <button class="btn-attack" onclick="engine.launchAttack()">🚀 ATEŞLE</button>

            <h3>ASKERİ LOGLAR</h3>
            <div id="log-box"></div>
        </div>

    </div>

    <!-- Oyun Motorunu Bağlıyoruz -->
    <script src="game.js"></script>
</body>
</html>
